# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repo.
services:
  - type: web
    name: intern-scout-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: singapore
    plan: starter # a persistent disk needs a paid instance; free instances also sleep, which stops the scheduler
    branch: main
    healthCheckPath: /health
    disk:
      name: intern-scout-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: LINKEDIN_SESSION_PATH
        value: /etc/secrets/linkedin-session.json
      - key: FRONTEND_ORIGIN
        sync: false # your Vercel URL, e.g. https://intern-scout.vercel.app
      - key: SERPER_API_KEY
        sync: false
      - key: LINKEDIN_LOCATION
        value: Singapore
